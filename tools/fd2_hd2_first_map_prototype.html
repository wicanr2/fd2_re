<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>炎龍騎士團2｜HD2首章站姿原型</title>
<style>
@font-face{font-family:FD2;src:url(cjk.ttc)}*{box-sizing:border-box}body{margin:0;background:#071322;color:#eee5cd;font-family:FD2,sans-serif}main{max-width:1600px;margin:auto;padding:12px}h1{font-size:20px;font-weight:500;margin:0 0 8px}p{font-size:14px;line-height:1.6;margin:8px 0;color:#becbda}.stage{position:relative;aspect-ratio:8/5;outline:2px solid #b48c4d;overflow:hidden;background:#0b1c30}canvas{width:100%;height:100%;display:block;outline:0}.toolbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:6px 12px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;background:#0b1e36f5;border-bottom:2px solid #c6a25f;transform:translateY(-100%);transition:transform .15s;z-index:5}.toolbar.open,.toolbar:focus-within{transform:translateY(0)}button,select{font:inherit;font-size:15px;background:#17334f;color:#f5dfad;border:1px solid #c2a163;padding:5px 9px}label{display:flex;gap:6px;align-items:center;font-size:14px}.handle{position:absolute;top:0;left:48%;height:10px;width:4%;border:1px solid #a98243;background:#17334f;border-radius:0 0 6px 6px;pointer-events:none}.info{position:absolute;right:2.5%;bottom:4%;width:35%;height:24%;padding:10px;display:grid;grid-template-columns:37% 1fr;gap:10px;background:#102d4deb;border:3px double #d1ac66;box-shadow:0 0 0 2px #263c4f}.portrait{width:100%;height:100%;object-fit:cover;border:1px solid #e6c178;min-height:0}.copy{min-width:0;display:flex;flex-direction:column;overflow:hidden}.name{font-size:clamp(15px,1.8vw,30px);white-space:nowrap}.unitrow{display:flex;align-items:center;gap:8px;min-height:0;flex:1}.icon{width:42%;height:100%;object-fit:contain;min-height:0}.mode{font-size:clamp(10px,1.1vw,17px);line-height:1.4;color:#d4e1ee}.coords{font-size:clamp(10px,1.1vw,17px);white-space:nowrap}.stamp{position:absolute;left:2%;bottom:3%;font-size:clamp(10px,1.2vw,18px);background:#081d31e8;border:1px solid #a98449;padding:5px 10px;max-width:52%;line-height:1.5}strong{font-weight:500;color:#f6d79c}
</style><main><h1>HD2 首章站姿呈現原型</h1><div class="stage" id="stage"><canvas id="world" width="1920" height="1200" tabindex="0" aria-label="首關圖格與索爾站姿呈現原型"></canvas><div class="handle"></div><div id="toolbar" class="toolbar"><button id="mode">人物：HD2試稿</button><label>站姿高度<select id="height"><option>144</option><option selected>168</option><option>192</option></select>px</label><label><input id="grid" type="checkbox" checked>圖格</label><button id="reset">回到出擊格</button><span>F2切換人物對照　方向鍵檢視圖格</span></div><div class="info"><img id="portrait" class="portrait" alt="索爾本人頭像"><div class="copy"><div class="name">索爾</div><div class="unitrow"><img id="icon" class="icon" alt="與地圖相同的索爾圖源"><div id="modeLabel" class="mode"></div></div><div id="coords" class="coords"></div></div></div><div class="stamp"><strong>站姿試作 DRAFT</strong><br>地形暫沿HD1；尚未製作走行與戰鬥。</div></div><p>游標與角色落腳點沿首章方格。人物高度可比較144／168／192像素，資訊窗與地圖使用同一身份及人物圖源。此頁不執行遊戲規則，不改存檔。人物身份與服裝依本人原圖，未新增角色設定。</p></main>
<script>
const data=__BOOTSTRAP_DATA__;
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),stage=document.querySelector('#stage'),toolbar=document.querySelector('#toolbar');
const actors=data.actors||[{identity:0,name:data.name,...data.actor,sprite:data.sprite,original:data.original,portrait_hd:'portrait-hd.png',portrait_original:'portrait-original.png'}];
const state={ready:false,mode:'hd2',height:168,grid:true,camera:{...data.camera},cursor:{...data.actor},actor:{identity:0,...data.actor}};
const images={};
function load(key,file){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve()};im.onerror=()=>reject(Error(file));im.src=file})}
const selected=()=>actors.find(a=>a.identity===state.actor.identity);
function foot(actor=state.actor){return{x:24+(actor.x-state.camera.x+.5)*144,y:24+(actor.y-state.camera.y+1)*144}}
function actorFile(actor){return state.mode==='hd2'?actor.sprite.file:actor.original.file}
function selectActor(actor){state.actor={identity:actor.identity,x:actor.x,y:actor.y};if(document.querySelector('#actor'))document.querySelector('#actor').value=String(actor.identity)}
function selectAtCursor(){const actor=actors.find(a=>a.x===state.cursor.x&&a.y===state.cursor.y);if(actor)selectActor(actor)}
function drawActor(actor){const anchor=foot(actor),image=images[(state.mode==='hd2'?'hd2-':'original-')+actor.identity];let scale,x,y;if(state.mode==='hd2'){scale=state.height/actor.sprite.body_height;x=anchor.x-actor.sprite.foot[0]*scale;y=anchor.y-actor.sprite.foot[1]*scale}else{scale=6;x=anchor.x-image.width*scale/2;y=anchor.y-image.height*scale;ctx.imageSmoothingEnabled=false}ctx.drawImage(image,x,y,image.width*scale,image.height*scale);ctx.imageSmoothingEnabled=true;ctx.fillStyle='#ffe8a8';ctx.beginPath();ctx.arc(anchor.x,anchor.y,3,0,Math.PI*2);ctx.fill()}
function render(){if(!state.ready)return;ctx.imageSmoothingEnabled=true;ctx.fillStyle='#0a1b2e';ctx.fillRect(0,0,1920,1200);ctx.drawImage(images.background,state.camera.x*144,state.camera.y*144,13*144,8*144,24,24,13*144,8*144);
 if(state.grid){ctx.strokeStyle='#f8df9c38';ctx.lineWidth=1;for(let x=0;x<=13;x++){ctx.beginPath();ctx.moveTo(24+x*144,24);ctx.lineTo(24+x*144,1176);ctx.stroke()}for(let y=0;y<=8;y++){ctx.beginPath();ctx.moveTo(24,24+y*144);ctx.lineTo(1896,24+y*144);ctx.stroke()}}
 ctx.strokeStyle='#f8df8c';ctx.lineWidth=5;ctx.strokeRect(24+(state.cursor.x-state.camera.x)*144+4,24+(state.cursor.y-state.camera.y)*144+4,136,136);
 actors.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(drawActor);
 const actor=selected();document.querySelector('#mode').textContent=state.mode==='hd2'?'人物：HD2試稿':'人物：原版圖源';document.querySelector('#icon').src=actorFile(actor);document.querySelector('#portrait').src=state.mode==='hd2'?actor.portrait_hd:actor.portrait_original;document.querySelector('.name').textContent=actor.name;document.querySelector('.info').dataset.identity=String(actor.identity);document.querySelector('#icon').alt=actor.name+'地圖圖源';document.querySelector('#portrait').alt=actor.name+'本人頭像';document.querySelector('#modeLabel').textContent=state.mode==='hd2'?'斜角站姿試稿\n頭像沿本人HD圖':'原版人物圖源\n不代表完整原版畫面';document.querySelector('#coords').textContent=`圖格 ${state.cursor.x}, ${state.cursor.y}`;
}
function toggle(){state.mode=state.mode==='hd2'?'original':'hd2';render()}
function focusCursor(){selectAtCursor();state.camera.x=Math.max(0,Math.min(11,state.cursor.x<state.camera.x?state.cursor.x:state.cursor.x>state.camera.x+12?state.cursor.x-12:state.camera.x));state.camera.y=Math.max(0,Math.min(16,state.cursor.y<state.camera.y?state.cursor.y:state.cursor.y>state.camera.y+7?state.cursor.y-7:state.camera.y));render()}
document.querySelector('#mode').onclick=toggle;document.querySelector('#height').onchange=e=>{state.height=Number(e.target.value);render()};document.querySelector('#grid').onchange=e=>{state.grid=e.target.checked;render()};document.querySelector('#reset').onclick=()=>{selectActor(actors[0]);state.cursor={...data.actor};state.camera={...data.camera};render()};
if(actors.length>1){const label=document.createElement('label'),choice=document.createElement('select');label.append('角色');choice.id='actor';for(const actor of actors){const option=document.createElement('option');option.value=String(actor.identity);option.textContent=actor.name;choice.append(option)}label.append(choice);toolbar.insertBefore(label,document.querySelector('#height').closest('label'));choice.onchange=()=>{const actor=actors.find(a=>a.identity===Number(choice.value));selectActor(actor);state.cursor={x:actor.x,y:actor.y};focusCursor()};const style=document.createElement('style');style.textContent='.stage.party .info{left:2.5%;right:auto}.stage.party .stamp{top:64px;bottom:auto}';document.head.append(style);stage.classList.add('party');canvas.setAttribute('aria-label','首關四人站姿呈現原型');document.querySelector('h1').textContent='HD2 首關四人站姿呈現原型'}
stage.addEventListener('pointermove',e=>{const box=canvas.getBoundingClientRect();toolbar.classList.toggle('open',e.clientY-box.top<60);if(e.target!==canvas)return;const px=(e.clientX-box.left)*1920/box.width-24,py=(e.clientY-box.top)*1200/box.height-24;if(px<0||py<0||px>=13*144||py>=8*144)return;const x=Math.floor(px/144)+state.camera.x,y=Math.floor(py/144)+state.camera.y;if(x>=0&&x<24&&y>=0&&y<24){state.cursor={x,y};selectAtCursor();render()}});stage.addEventListener('pointerleave',()=>toolbar.classList.remove('open'));
canvas.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();toggle();return}const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();state.cursor.x=Math.max(0,Math.min(23,state.cursor.x+d[0]));state.cursor.y=Math.max(0,Math.min(23,state.cursor.y+d[1]));focusCursor()}});
window.hd2PrototypeState=()=>({...state,actor:{...state.actor},cursor:{...state.cursor},camera:{...state.camera},foot:foot(),mapIdentity:selected().identity,hudIdentity:Number(document.querySelector('.info').dataset.identity),mapImage:actorFile(selected()),hudImage:document.querySelector('#icon').getAttribute('src'),portraitImage:document.querySelector('#portrait').getAttribute('src'),actors:actors.map(a=>({identity:a.identity,name:a.name,x:a.x,y:a.y,foot:foot(a),image:actorFile(a)})),rulesExecuted:false,saveWrites:0});
Promise.all([load('background',data.map.background),...actors.flatMap(a=>[load('hd2-'+a.identity,a.sprite.file),load('original-'+a.identity,a.original.file),load('portrait-hd-'+a.identity,a.portrait_hd),load('portrait-original-'+a.identity,a.portrait_original)])]).then(()=>{state.ready=true;render();canvas.focus()}).catch(e=>{document.querySelector('h1').textContent='素材未載入：'+e.message;throw e});
</script></html>
