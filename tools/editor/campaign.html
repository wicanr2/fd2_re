<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>炎龍騎士團 2 — 劇情編輯器</title>
<style>
:root { --ink:#1b1b1b; --muted:#6b6b6b; --line:#d8d4cc; --bg:#faf9f6; --panel:#fff; --accent:#8c3b2f; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { margin:0; font-size:16px; font-weight:600; }
header .path { color:var(--muted); font-size:13px; }
nav { display:flex; gap:2px; padding:0 20px; border-bottom:1px solid var(--line); background:var(--panel); }
nav button { border:0; border-bottom:2px solid transparent; background:none; padding:9px 14px;
  font:inherit; color:var(--muted); cursor:pointer; }
nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
main { display:flex; align-items:stretch; min-height:calc(100vh - 96px); }
aside { width:230px; flex:none; padding:14px 16px; border-right:1px solid var(--line);
  background:var(--panel); overflow-y:auto; max-height:calc(100vh - 96px); }
/* 兩個方向都要捲動：線性的章節橫向拉得很長（第 1 章七個節點就超出視窗），只給
   overflow-y 的話右邊的節點與跨章標籤會被切掉而且捲不到。 */
section { flex:1; padding:16px 20px; overflow:auto; max-height:calc(100vh - 96px); }
h2 { font-size:13px; font-weight:600; margin:16px 0 8px; color:var(--muted); }
h2:first-child { margin-top:0; }
h3 { font-size:14px; font-weight:600; margin:20px 0 6px; }
button { font:inherit; padding:5px 12px; border:1px solid var(--line); border-radius:3px;
  background:var(--panel); color:var(--ink); cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--ink); }
button:disabled { color:var(--muted); cursor:not-allowed; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.small { padding:2px 8px; font-size:12px; }
input, select, textarea { font:inherit; width:100%; padding:4px 6px; border:1px solid var(--line);
  border-radius:3px; background:var(--panel); color:var(--ink); }
textarea { min-height:4.5em; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
.files button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line);
  border-radius:0; padding:6px 4px; color:var(--muted); }
.files button[aria-current="true"] { color:var(--ink); font-weight:600; }
.line { display:grid; grid-template-columns:150px 1fr auto; gap:8px; align-items:start; margin-bottom:6px; }
.goods { display:grid; grid-template-columns:90px 1fr 110px auto; gap:8px; align-items:center; margin-bottom:6px; }
.event { border:1px solid var(--line); border-radius:4px; padding:12px 14px; margin-bottom:12px; background:var(--panel); }
.event .head { display:grid; grid-template-columns:1fr 1fr 90px auto; gap:8px; align-items:end; margin-bottom:10px; }
label span { display:block; color:var(--muted); font-size:12px; }
#log { margin:14px 20px; padding:8px 10px; border-left:3px solid var(--line); color:var(--muted);
  white-space:pre-wrap; font-size:13px; }
#log.bad { border-left-color:var(--accent); color:var(--accent); }
.hint { color:var(--muted); font-size:12px; margin:6px 0 0; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th, td { text-align:left; padding:4px 8px 4px 0; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:400; }
</style>
</head>
<body>
<header>
  <h1>劇情編輯器</h1>
  <span class="path" id="where">尚未開啟 assets</span>
  <button id="open" class="primary">開啟 assets 資料夾…</button>
  <button id="save" disabled>存回</button>
</header>

<nav>
  <button data-tab="story" aria-selected="true">對白</button>
  <button data-tab="events">戰場事件</button>
  <button data-tab="shops">商店</button>
  <button data-tab="graph">節點轉場</button>
  <button data-tab="node-graph">節點圖</button>
</nav>

<div id="log">按「開啟 assets 資料夾…」，選 <code>remake/assets</code>（裡面要有 story/ 與 scenarios/）。</div>

<main>
  <aside class="files" id="files"></aside>
  <section id="pane"></section>
</main>

<script>
'use strict';

const TRIGGERS = ['on_battle_start', 'on_turn_end', 'on_unit_death'];
// 動作型別取自現有 30 份 scenario 的實際用法。表單只認常見的幾種；其餘型別保留
// 原始 JSON 編輯，不假裝看得懂——猜錯欄位名會寫出引擎讀不動的事件。
const ACTION_FORMS = {
  dialogue: [['speaker', '說話者 ID'], ['text', '台詞']],
  spawn_group: [['groups', 'group 陣列（逗號分隔）'], ['camp', '陣營']],
  spawn_party: [],
  pan: [['x', 'x'], ['y', 'y']],
  delay: [['frames', '幀數']],
};

const state = { dir: null, story: new Map(), scenarios: new Map(), campaign: null,
  tab: 'story', file: '', dirty: new Set() };

const $ = (id) => document.getElementById(id);
function say(text, bad) { const l = $('log'); l.textContent = text; l.className = bad ? 'bad' : ''; }
function mark(name) { state.dirty.add(name); $('save').disabled = false; }

async function readJSON(handle) { return JSON.parse(await (await handle.getFile()).text()); }

async function openAssets() {
  if (!window.showDirectoryPicker) {
    say('這個瀏覽器沒有 File System Access API（showDirectoryPicker）。Chrome 與 Edge 有。', true);
    return;
  }
  let dir;
  try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (err) { if (!err || err.name !== 'AbortError') say('開啟失敗：' + err, true); return; }
  try {
    state.dir = dir; state.story.clear(); state.scenarios.clear(); state.dirty.clear();
    const storyDir = await dir.getDirectoryHandle('story');
    for await (const [name, handle] of storyDir.entries()) {
      if (name.endsWith('.json')) state.story.set(name, await readJSON(handle));
    }
    const scenarioDir = await dir.getDirectoryHandle('scenarios');
    for await (const [name, handle] of scenarioDir.entries()) {
      if (name === 'campaign_full.json') state.campaign = await readJSON(handle);
      else if (name.endsWith('.json')) state.scenarios.set(name, await readJSON(handle));
    }
    $('where').textContent = `${dir.name}／story ${state.story.size} 份、scenario ${state.scenarios.size} 份`
      + (state.campaign ? `、campaign ${Object.keys(state.campaign.nodes).length} 個節點` : '、沒有 campaign_full.json');
    $('save').disabled = true;
    render();
    say('已載入。改完按「存回」；campaign_full.json 改過之後要重跑 '
      + 'tools/export_editor_canonical.py，正式執行期讀的是 canonical bundle。');
  } catch (err) {
    say('讀取失敗：' + err + '\n要選 remake/assets（裡面有 story/ 與 scenarios/）。', true);
  }
}

function render() {
  renderFiles();
  ({ story: renderStory, events: renderEvents, shops: renderShops,
     graph: renderGraph, 'node-graph': renderNodeGraph })[state.tab]();
}

function renderFiles() {
  const box = $('files');
  if (state.tab === 'story' || state.tab === 'events') {
    const table = state.tab === 'story' ? state.story : state.scenarios;
    const names = [...table.keys()].sort();
    if (!names.includes(state.file)) state.file = names[0] || '';
    box.innerHTML = '<h2>' + (state.tab === 'story' ? '劇情檔' : '戰場檔') + '</h2>'
      + names.map((name) =>
        `<button data-file="${name}" aria-current="${name === state.file}">${name}</button>`).join('');
    box.querySelectorAll('[data-file]').forEach((button) =>
      button.addEventListener('click', () => { state.file = button.dataset.file; render(); }));
  } else {
    box.innerHTML = '<h2>範圍</h2><p class="hint">這一頁讀 scenarios/campaign_full.json。</p>';
  }
}

function field(label, value, onInput, type) {
  const wrap = document.createElement('label');
  wrap.innerHTML = `<span>${label}</span>`;
  const input = document.createElement(type === 'area' ? 'textarea' : 'input');
  input.value = value ?? '';
  input.addEventListener('change', () => onInput(input.value));
  wrap.appendChild(input);
  return wrap;
}

function renderStory() {
  const pane = $('pane');
  const doc = state.story.get(state.file);
  if (!doc) { pane.innerHTML = '<p class="hint">沒有劇情檔。</p>'; return; }
  pane.innerHTML = `<h3>${state.file}　${doc.title || ''}</h3>`;
  // 說話者下拉從整份檔案現有的台詞收集，不另外維護一張會漂的名單。
  const speakers = new Map();
  for (const scene of doc.scenes || []) {
    for (const line of scene.lines || []) {
      if (line.speaker !== undefined) speakers.set(line.speaker, line.speaker_name || '');
    }
  }
  (doc.scenes || []).forEach((scene, sceneIndex) => {
    const box = document.createElement('div');
    box.innerHTML = `<h3>場景 ${sceneIndex}${scene.label ? '：' + scene.label : ''}</h3>`;
    (scene.lines || []).forEach((line, lineIndex) => {
      const row = document.createElement('div');
      row.className = 'line';
      const pick = document.createElement('select');
      pick.innerHTML = [...speakers.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([id, name]) => `<option value="${id}"${id === line.speaker ? ' selected' : ''}>${id}　${name}</option>`)
        .join('');
      pick.addEventListener('change', () => {
        line.speaker = Number(pick.value);
        line.speaker_name = speakers.get(line.speaker) || '';
        mark(`story/${state.file}`);
      });
      const text = document.createElement('input');
      text.value = line.text || '';
      text.addEventListener('change', () => { line.text = text.value; mark(`story/${state.file}`); });
      const drop = document.createElement('button');
      drop.className = 'small'; drop.textContent = '刪除';
      drop.addEventListener('click', () => {
        scene.lines.splice(lineIndex, 1); mark(`story/${state.file}`); render();
      });
      row.append(pick, text, drop);
      box.appendChild(row);
    });
    const add = document.createElement('button');
    add.className = 'small'; add.textContent = '加一句';
    add.addEventListener('click', () => {
      const first = [...speakers.keys()][0] ?? 0;
      (scene.lines || (scene.lines = [])).push(
        { speaker: first, speaker_name: speakers.get(first) || '', text: '' });
      mark(`story/${state.file}`); render();
    });
    box.appendChild(add);
    pane.appendChild(box);
  });
}

function renderEvents() {
  const pane = $('pane');
  const doc = state.scenarios.get(state.file);
  if (!doc) { pane.innerHTML = '<p class="hint">沒有戰場檔。</p>'; return; }
  pane.innerHTML = `<h3>${state.file}　第 ${doc.chapter ?? '?'} 章　${doc.name || ''}</h3>`;
  (doc.events || []).forEach((event, index) => {
    const box = document.createElement('div');
    box.className = 'event';
    const head = document.createElement('div');
    head.className = 'head';
    head.appendChild(field('事件 id', event.id, (v) => { event.id = v; mark(`scenarios/${state.file}`); }));
    const trigger = document.createElement('label');
    trigger.innerHTML = '<span>觸發</span>';
    const pick = document.createElement('select');
    pick.innerHTML = TRIGGERS.map((t) =>
      `<option${t === event.trigger ? ' selected' : ''}>${t}</option>`).join('');
    pick.addEventListener('change', () => { event.trigger = pick.value; mark(`scenarios/${state.file}`); });
    trigger.appendChild(pick);
    head.appendChild(trigger);
    head.appendChild(field('回合（when.turn）', event.when && event.when.turn, (v) => {
      if (v === '') delete event.when; else event.when = { ...(event.when || {}), turn: Number(v) };
      mark(`scenarios/${state.file}`);
    }));
    const drop = document.createElement('button');
    drop.className = 'small'; drop.textContent = '刪除事件';
    drop.addEventListener('click', () => { doc.events.splice(index, 1); mark(`scenarios/${state.file}`); render(); });
    head.appendChild(drop);
    box.appendChild(head);

    (event.do || []).forEach((action, actionIndex) => {
      const row = document.createElement('div');
      row.style.marginBottom = '10px';
      const form = ACTION_FORMS[action.type];
      row.innerHTML = `<strong>${action.type}</strong>`;
      if (!form) {
        // 不認得的型別給原始 JSON：猜欄位名會寫出引擎讀不動的事件。
        row.appendChild(field('原始 JSON', JSON.stringify(action), (v) => {
          try {
            event.do[actionIndex] = JSON.parse(v);
            mark(`scenarios/${state.file}`);
            say(`${action.type} 已更新。`);
          } catch (err) { say('這不是合法 JSON，沒有套用：' + err, true); }
        }, 'area'));
      } else {
        for (const [key, label] of form) {
          row.appendChild(field(label, Array.isArray(action[key]) ? action[key].join(',') : action[key], (v) => {
            if (key === 'groups') action[key] = v.split(',').map((n) => Number(n.trim())).filter((n) => !isNaN(n));
            else if (typeof action[key] === 'number' || /^-?\d+$/.test(v)) action[key] = Number(v);
            else action[key] = v;
            mark(`scenarios/${state.file}`);
          }));
        }
      }
      box.appendChild(row);
    });
    pane.appendChild(box);
  });
  const add = document.createElement('button');
  add.textContent = '加一個事件';
  add.addEventListener('click', () => {
    (doc.events || (doc.events = [])).push({
      id: 'new_event', trigger: 'on_turn_end', when: { turn: 1 }, once: true,
      do: [{ type: 'dialogue', speaker: 0, text: '' }],
    });
    mark(`scenarios/${state.file}`); render();
  });
  pane.appendChild(add);
  const note = document.createElement('p');
  note.className = 'hint';
  note.textContent = '表單只認得 ' + Object.keys(ACTION_FORMS).join('、')
    + '；其他型別用原始 JSON 編輯，欄位名不猜。';
  pane.appendChild(note);
}

function renderShops() {
  const pane = $('pane');
  if (!state.campaign) { pane.innerHTML = '<p class="hint">沒有 campaign_full.json。</p>'; return; }
  const shops = Object.entries(state.campaign.nodes).filter(([, node]) => node.type === 'shop');
  pane.innerHTML = `<h3>商店節點（${shops.length}）</h3>`;
  for (const [id, node] of shops) {
    const box = document.createElement('div');
    box.className = 'event';
    box.innerHTML = `<strong>${id}</strong>`;
    (node.goods || []).forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'goods';
      for (const [key, label] of [['id', '物品 ID'], ['name', '名稱'], ['price', '價格']]) {
        row.appendChild(field(label, item[key], (v) => {
          item[key] = key === 'name' ? v : Number(v);
          mark('scenarios/campaign_full.json');
        }));
      }
      const drop = document.createElement('button');
      drop.className = 'small'; drop.textContent = '刪除';
      drop.addEventListener('click', () => {
        node.goods.splice(index, 1); mark('scenarios/campaign_full.json'); render();
      });
      row.appendChild(drop);
      box.appendChild(row);
    });
    const add = document.createElement('button');
    add.className = 'small'; add.textContent = '加一項';
    add.addEventListener('click', () => {
      (node.goods || (node.goods = [])).push({ id: 0, name: '', price: 0 });
      mark('scenarios/campaign_full.json'); render();
    });
    box.appendChild(add);
    pane.appendChild(box);
  }
}

function renderGraph() {
  const pane = $('pane');
  if (!state.campaign) { pane.innerHTML = '<p class="hint">沒有 campaign_full.json。</p>'; return; }
  const ids = Object.keys(state.campaign.nodes).sort();
  pane.innerHTML = `<h3>節點轉場（${ids.length}）</h3>
    <p class="hint">下拉只列得出現有節點，選不到不存在的目標——campaign.Decode 會拒絕
    斷裂的轉場，在這裡擋住比在遊戲啟動時失敗好。</p>`;
  const table = document.createElement('table');
  table.innerHTML = '<tr><th>節點</th><th>型別</th><th>next</th><th>on_win</th><th>on_lose</th></tr>';
  for (const id of ids) {
    const node = state.campaign.nodes[id];
    const row = document.createElement('tr');
    row.innerHTML = `<td>${id}</td><td>${node.type}</td>`;
    for (const key of ['next', 'on_win', 'on_lose']) {
      const cell = document.createElement('td');
      if (node[key] === undefined && key !== 'next') { cell.innerHTML = '<span class="hint">—</span>'; }
      else {
        const pick = document.createElement('select');
        pick.innerHTML = '<option value="">（無）</option>'
          + ids.map((other) => `<option${other === node[key] ? ' selected' : ''}>${other}</option>`).join('');
        pick.addEventListener('change', () => {
          if (pick.value === '') delete node[key]; else node[key] = pick.value;
          mark('scenarios/campaign_full.json');
        });
        cell.appendChild(pick);
      }
      row.appendChild(cell);
    }
    table.appendChild(row);
  }
  pane.appendChild(table);
}

// ── 節點圖 ───────────────────────────────────────────────────────────────
// doc 38 Phase 3：拖線轉場、旗標管理、敗北路線可視化。連線用「點端點再點目標」
// 而不是自由拖曳——299 個節點擠在一起時，拖到隔壁節點的機率比拖對還高，而接錯的
// 轉場要玩到那一關才會發作。

const NODE_FILL = {
  battle: '#f3dcd7', story: '#e8e6e0', cutscene: '#e8e6e0', town: '#dce8dd',
  shop: '#e3e6ef', church: '#e3e6ef', preparation: '#efe9dc', choice: '#f6efc9',
  ending: '#e0dbe8',
};
const LINK_FIELDS = [
  ['next', '#6b6b6b'], ['on_win', '#2f6f3f'], ['on_lose', '#8c3b2f'],
];
const NODE_W = 150, NODE_H = 34, GAP_X = 60, GAP_Y = 14;

const graph = { chapter: '', selected: '', linking: null };

function chapterOf(id) {
  const match = /ch(\d+)/.exec(id);
  return match ? match[1] : '—';
}

function chaptersInCampaign() {
  const seen = new Set();
  for (const id of Object.keys(state.campaign.nodes)) seen.add(chapterOf(id));
  return [...seen].sort((a, b) => Number(a) - Number(b));
}

function nodesOfChapter(chapter) {
  return Object.keys(state.campaign.nodes)
    .filter((id) => chapterOf(id) === chapter).sort();
}

// 依「從沒有入邊的節點算起的距離」分層。原版戰役是線性的，分層後一眼看得出主線；
// 自己接出來的分支會落在同一層的下方。
function layout(ids) {
  const inside = new Set(ids);
  const targets = new Map(ids.map((id) => [id, linksOf(id).map((l) => l.to).filter((t) => inside.has(t))]));
  const hasIncoming = new Set();
  for (const list of targets.values()) for (const t of list) hasIncoming.add(t);
  const depth = new Map();
  const queue = ids.filter((id) => !hasIncoming.has(id));
  for (const id of queue) depth.set(id, 0);
  if (!queue.length && ids.length) { queue.push(ids[0]); depth.set(ids[0], 0); }
  // 廣度優先、每個節點只定一次層。**不能改成「取最長路徑」**：敗北路線讓每一章都
  // 有 retreat_chNN → battle_chNN 的環（原版 30 章每章都有），而「比較深就更新」在
  // 環上每繞一圈就加一，永遠不收斂。
  while (queue.length) {
    const id = queue.shift();
    for (const to of targets.get(id) || []) {
      if (depth.has(to)) continue;
      depth.set(to, depth.get(id) + 1);
      queue.push(to);
    }
  }
  for (const id of ids) if (!depth.has(id)) depth.set(id, 0);
  const columns = new Map();
  for (const id of ids) {
    const column = depth.get(id);
    if (!columns.has(column)) columns.set(column, []);
    columns.get(column).push(id);
  }
  const place = new Map();
  for (const [column, list] of columns) {
    list.forEach((id, row) => place.set(id, {
      x: 20 + column * (NODE_W + GAP_X),
      y: 20 + row * (NODE_H + GAP_Y),
    }));
  }
  return place;
}

function linksOf(id) {
  const node = state.campaign.nodes[id];
  const out = [];
  for (const [key, color] of LINK_FIELDS) {
    if (node[key]) out.push({ key, to: node[key], color });
  }
  (node.options || []).forEach((option, index) => {
    if (option.to) out.push({ key: `options[${index}]`, to: option.to, color: '#8a7a2f', option: index });
  });
  return out;
}

function renderNodeGraph() {
  const pane = $('pane');
  if (!state.campaign) { pane.innerHTML = '<p class="hint">沒有 campaign_full.json。</p>'; return; }
  const chapters = chaptersInCampaign();
  // 預設跳過只有一個節點的章節（第 0 章只有 story_ch00_handler），第一眼看到一格
  // 孤零零的方塊會讓人以為資料沒載進來。
  if (!chapters.includes(graph.chapter)) {
    graph.chapter = chapters.find((c) => nodesOfChapter(c).length > 1) || chapters[0];
  }
  const ids = nodesOfChapter(graph.chapter);
  const place = layout(ids);
  const width = Math.max(...[...place.values()].map((p) => p.x)) + NODE_W + 40;
  const height = Math.max(...[...place.values()].map((p) => p.y)) + NODE_H + 40;

  pane.innerHTML = `<div class="row">
    <label style="width:auto"><span>章節</span>
      <select id="chapterPick">${chapters.map((c) =>
        `<option${c === graph.chapter ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
    <button id="addChoice" class="small">加一個 choice 節點</button>
    <span class="hint" id="linkHint">${graph.linking
      ? `選 ${graph.linking.id} 的 ${graph.linking.key} 要連到哪個節點（再按一次取消）`
      : '點節點看屬性；在屬性面板按「改連到…」再點目標節點。'}</span>
  </div>`;

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', width); svg.setAttribute('height', height);
  svg.style.border = '1px solid var(--line)';
  svg.style.background = 'var(--panel)';
  svg.innerHTML = `<defs>${LINK_FIELDS.concat([['option', '#8a7a2f']]).map(([key, color]) =>
    `<marker id="arrow-${key}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
      orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="${color}"/></marker>`).join('')}</defs>`;

  for (const id of ids) {
    const from = place.get(id);
    for (const link of linksOf(id)) {
      const to = place.get(link.to);
      const marker = link.option !== undefined ? 'option' : link.key;
      if (!to) {
        // 目標在別的章節：畫一小段殘線加標籤，不要靜靜地不畫——看不見的轉場
        // 會讓人以為這一章是死路。
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', from.x + NODE_W + 6);
        text.setAttribute('y', from.y + NODE_H / 2 + 4);
        text.setAttribute('font-size', '11'); text.setAttribute('fill', link.color);
        text.textContent = `→ ${link.to}`;
        svg.appendChild(text);
        continue;
      }
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const x1 = from.x + NODE_W, y1 = from.y + NODE_H / 2;
      const x2 = to.x, y2 = to.y + NODE_H / 2;
      const mid = (x1 + x2) / 2;
      path.setAttribute('d', `M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`);
      path.setAttribute('fill', 'none'); path.setAttribute('stroke', link.color);
      path.setAttribute('stroke-width', link.key === 'on_lose' ? '1.5' : '1.2');
      if (link.key === 'on_lose') path.setAttribute('stroke-dasharray', '4 3');
      path.setAttribute('marker-end', `url(#arrow-${marker})`);
      svg.appendChild(path);
    }
  }
  for (const id of ids) {
    const at = place.get(id);
    const node = state.campaign.nodes[id];
    const box = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    box.style.cursor = 'pointer';
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', at.x); rect.setAttribute('y', at.y);
    rect.setAttribute('width', NODE_W); rect.setAttribute('height', NODE_H);
    rect.setAttribute('rx', '3');
    rect.setAttribute('fill', NODE_FILL[node.type] || '#eee');
    rect.setAttribute('stroke', id === graph.selected ? '#1b1b1b' : '#d8d4cc');
    rect.setAttribute('stroke-width', id === graph.selected ? '2' : '1');
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('x', at.x + 8); label.setAttribute('y', at.y + 15);
    label.setAttribute('font-size', '11');
    label.textContent = id.length > 22 ? id.slice(0, 21) + '…' : id;
    const kind = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    kind.setAttribute('x', at.x + 8); kind.setAttribute('y', at.y + 27);
    kind.setAttribute('font-size', '10'); kind.setAttribute('fill', '#6b6b6b');
    kind.textContent = node.type + (node.set_flags ? '　⚑' : '');
    box.append(rect, label, kind);
    box.addEventListener('click', () => {
      if (graph.linking) {
        applyLink(graph.linking, id);
        graph.linking = null;
      } else {
        graph.selected = id;
      }
      render();
    });
    svg.appendChild(box);
  }
  pane.appendChild(svg);

  const legend = document.createElement('p');
  legend.className = 'hint';
  legend.innerHTML = 'next 灰、on_win 綠、<span style="color:#8c3b2f">on_lose 紅虛線</span>、'
    + 'options 黃；⚑ 表示這個節點會設旗標。指到別章的轉場畫成節點右邊的文字。';
  pane.appendChild(legend);

  if (graph.selected && state.campaign.nodes[graph.selected]) renderNodeInspector(pane);

  $('chapterPick').addEventListener('change', (event) => {
    graph.chapter = event.target.value; graph.selected = ''; graph.linking = null; render();
  });
  $('addChoice').addEventListener('click', addChoiceNode);
}

function applyLink(linking, target) {
  const node = state.campaign.nodes[linking.id];
  const match = /^options\[(\d+)\]$/.exec(linking.key);
  if (match) node.options[Number(match[1])].to = target;
  else node[linking.key] = target;
  mark('scenarios/campaign_full.json');
  say(`${linking.id} 的 ${linking.key} 改連到 ${target}。`);
}

function renderNodeInspector(pane) {
  const id = graph.selected;
  const node = state.campaign.nodes[id];
  const box = document.createElement('div');
  box.className = 'event';
  box.innerHTML = `<h3>${id}　<span class="hint">${node.type}</span></h3>`;

  for (const [key] of LINK_FIELDS) {
    if (node[key] === undefined && key !== 'next') continue;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<strong style="width:70px">${key}</strong>
      <span>${node[key] || '（無）'}</span>`;
    const relink = document.createElement('button');
    relink.className = 'small'; relink.textContent = '改連到…';
    relink.addEventListener('click', () => { graph.linking = { id, key }; render(); });
    row.appendChild(relink);
    if (node[key]) {
      const clear = document.createElement('button');
      clear.className = 'small'; clear.textContent = '清掉';
      clear.addEventListener('click', () => {
        delete node[key]; mark('scenarios/campaign_full.json'); render();
      });
      row.appendChild(clear);
    }
    box.appendChild(row);
  }

  // 敗北路線：battle 節點沒有 on_lose 就是戰敗即結束。doc 38 Phase 3 的驗收要求
  // 至少接出一條，所以這裡給一個直接的入口。
  if (node.type === 'battle' && node.on_lose === undefined) {
    const add = document.createElement('button');
    add.className = 'small'; add.textContent = '加一條敗北路線';
    add.addEventListener('click', () => { graph.linking = { id, key: 'on_lose' }; render(); });
    box.appendChild(add);
  }

  const flagBox = document.createElement('div');
  flagBox.innerHTML = '<h3>旗標</h3>';
  const flags = Object.keys(state.campaign.flags || {}).sort();
  const setFlags = node.set_flags || {};
  for (const flag of flags) {
    const row = document.createElement('label');
    row.style.display = 'flex'; row.style.gap = '6px'; row.style.alignItems = 'center';
    const check = document.createElement('input');
    check.type = 'checkbox'; check.style.width = 'auto';
    check.checked = Object.prototype.hasOwnProperty.call(setFlags, flag);
    check.addEventListener('change', () => {
      if (check.checked) (node.set_flags || (node.set_flags = {}))[flag] = true;
      else if (node.set_flags) {
        delete node.set_flags[flag];
        if (!Object.keys(node.set_flags).length) delete node.set_flags;
      }
      mark('scenarios/campaign_full.json'); render();
    });
    row.append(check, document.createTextNode(flag));
    flagBox.appendChild(row);
  }
  const addFlag = document.createElement('button');
  addFlag.className = 'small'; addFlag.textContent = '新增旗標';
  addFlag.addEventListener('click', () => {
    const name = prompt('旗標名稱（英數與底線）');
    if (!name || !/^[A-Za-z0-9_]+$/.test(name)) { say('旗標名稱只接受英數與底線。', true); return; }
    (state.campaign.flags || (state.campaign.flags = {}))[name] = false;
    mark('scenarios/campaign_full.json'); render();
  });
  flagBox.appendChild(addFlag);
  box.appendChild(flagBox);

  if (node.type === 'choice' || node.type === 'town') {
    const options = document.createElement('div');
    options.innerHTML = '<h3>選項</h3>';
    (node.options || []).forEach((option, index) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.appendChild(field('標籤', option.label, (v) => {
        option.label = v; mark('scenarios/campaign_full.json');
      }));
      const cond = document.createElement('label');
      cond.innerHTML = '<span>顯示條件（旗標）</span>';
      const pick = document.createElement('select');
      pick.innerHTML = '<option value="">（無條件）</option>'
        + flags.map((f) => `<option${f === option.if ? ' selected' : ''}>${f}</option>`).join('');
      pick.addEventListener('change', () => {
        if (pick.value === '') delete option.if; else option.if = pick.value;
        mark('scenarios/campaign_full.json');
      });
      cond.appendChild(pick);
      row.appendChild(cond);
      const relink = document.createElement('button');
      relink.className = 'small'; relink.textContent = `→ ${option.to || '未接'}`;
      relink.addEventListener('click', () => {
        graph.linking = { id, key: `options[${index}]` }; render();
      });
      row.appendChild(relink);
      const drop = document.createElement('button');
      drop.className = 'small'; drop.textContent = '刪除';
      drop.addEventListener('click', () => {
        node.options.splice(index, 1); mark('scenarios/campaign_full.json'); render();
      });
      row.appendChild(drop);
      options.appendChild(row);
    });
    const add = document.createElement('button');
    add.className = 'small'; add.textContent = '加一個選項';
    add.addEventListener('click', () => {
      (node.options || (node.options = [])).push({ label: '新選項', to: '' });
      mark('scenarios/campaign_full.json'); render();
    });
    options.appendChild(add);
    box.appendChild(options);
  }
  pane.appendChild(box);
}

function addChoiceNode() {
  const id = prompt('新節點 id（建議帶章節，例如 choice_ch03_route）');
  if (!id) return;
  if (!/^[A-Za-z0-9_]+$/.test(id)) { say('節點 id 只接受英數與底線。', true); return; }
  if (state.campaign.nodes[id]) { say(`節點 ${id} 已經存在。`, true); return; }
  state.campaign.nodes[id] = {
    type: 'choice', prompt: '要走哪一條路？',
    options: [{ label: '選項一', to: '' }, { label: '選項二', to: '' }],
  };
  graph.selected = id;
  mark('scenarios/campaign_full.json');
  render();
  say(`已加入 ${id}。選項要接到節點才走得通——campaign.Decode 會拒絕空目標。`);
}

async function writeInto(dirName, fileName, value) {
  const dir = await state.dir.getDirectoryHandle(dirName);
  const handle = await dir.getFileHandle(fileName, { create: false });
  const stream = await handle.createWritable();
  await stream.write(JSON.stringify(value, null, 2) + '\n');
  await stream.close();
}

async function save() {
  try {
    for (const key of state.dirty) {
      const [dirName, fileName] = key.split('/');
      const value = dirName === 'story' ? state.story.get(fileName)
        : fileName === 'campaign_full.json' ? state.campaign : state.scenarios.get(fileName);
      await writeInto(dirName, fileName, value);
    }
    const touchedCampaign = [...state.dirty].some((k) => k.endsWith('campaign_full.json'));
    const count = state.dirty.size;
    state.dirty.clear(); $('save').disabled = true;
    say(`已存回 ${count} 份檔案。` + (touchedCampaign
      ? '\n改到 campaign_full.json 了：**要重跑 tools/export_editor_canonical.py**，'
        + '正式執行期讀的是 canonical bundle，不重生的話遊戲裡看不到這次改動'
        + '（回歸會以「canonical 與 legacy 不一致」失敗）。'
      : ''));
  } catch (err) {
    say('存檔失敗：' + err, true);
  }
}

$('open').addEventListener('click', openAssets);
$('save').addEventListener('click', save);
document.querySelectorAll('[data-tab]').forEach((button) => {
  button.addEventListener('click', () => {
    state.tab = button.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach((other) =>
      other.setAttribute('aria-selected', String(other === button)));
    if (state.dir) render();
  });
});
window.addEventListener('beforeunload', (event) => {
  if (state.dirty.size) { event.preventDefault(); event.returnValue = ''; }
});
</script>
</body>
</html>
