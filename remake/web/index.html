<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<title>炎龍騎士團2 重製 (fd2_re)</title>
<style>body{margin:0;background:#111;color:#ccc;font-family:sans-serif;text-align:center}
h3{padding:8px;margin:0;font-size:16px}
#status{padding:8px;font-size:14px;color:#999}
/* 畫布跟著視窗縮放並保持比例。image-rendering: pixelated 讓放大時維持點陣感，
   不要被瀏覽器平滑成糊的。 */
canvas{image-rendering:pixelated;max-width:100vw;max-height:calc(100vh - 60px);
  width:auto;height:auto;object-fit:contain}</style></head>
<body><h3>炎龍騎士團2 重製 — Go/Ebiten WASM</h3>
<div id="status">載入中…</div>
<script src="wasm_exec.js"></script>
<script>
// 檔案系統轉接層：Go 的 os.ReadFile／os.WriteFile 在 js/wasm 底下沒有東西可讀寫，
// wasm_exec.js 附的 fs polyfill 對 open／read／write／fstat 一律回 ENOSYS。
//
// 讀取走資產包（見下方說明），寫入走 localStorage——存檔與設定是少數幾個小 JSON，
// 而 localStorage 是同步的，正好對得上 Go 那邊的同步回呼。寫入實測走完 Go 的存檔
// 流程（建立暫存檔 → 寫 → 關 → rename → 讀回），寫過的檔案在讀取時蓋過資產包。
//
// 沒做的是目錄：mkdir 一律回成功、stat 一律回「不是目錄」。目前沒有程式碼需要列
// 目錄（assetGlob 走索引），真的需要時要另外處理，不要以為它已經支援。
//
// 資產走一個打包檔（tools/build_asset_pak.py）。**不要改回逐檔取用**：Go 的 fs
// 介面是同步回呼，逐檔就只能用同步 XMLHttpRequest，而 Chrome 對主執行緒的同步請求
// 節流到每秒兩個左右——這個遊戲光是啟動就要讀六千多個檔案。打包檔一次取回之後全部
// 在記憶體裡，同步回呼就只是切一段 subarray。
//
// 包裡沒有的（音樂那幾個目錄體積大又要播到才需要）退回同步 XHR，數量少，可以接受。
const assetPak = (() => {
  let bytes = null;              // Uint8Array，整個包
  let dataStart = 0;             // 資料區在包裡的起點
  const index = new Map();       // 路徑 → [offset, length]

  const load = async (url) => {
    const response = await fetch(url);
    if (!response.ok) throw new Error(url + " 取不到：HTTP " + response.status);
    bytes = new Uint8Array(await response.arrayBuffer());
    const magic = new TextDecoder().decode(bytes.subarray(0, 8));
    if (magic !== "FD2PAK01") throw new Error(url + " 不是資產包（magic=" + magic + "）");
    const view = new DataView(bytes.buffer, bytes.byteOffset);
    const indexLength = view.getUint32(8, true);
    const header = JSON.parse(new TextDecoder().decode(bytes.subarray(12, 12 + indexLength)));
    dataStart = 12 + indexLength;
    for (const [name, span] of Object.entries(header.files)) index.set(name, span);
    return index.size;
  };

  const get = (path) => {
    // Go 那邊的路徑是絕對的（工作目錄補成 "/"），包裡的索引不帶開頭斜線。
    const key = path.replace(/^\/+/, "");
    const span = index.get(key);
    if (!span) return null;
    return bytes.subarray(dataStart + span[0], dataStart + span[0] + span[1]);
  };

  return { load, get };
})();

// 可寫層：存檔與設定。localStorage 是同步的，所以 Go 的同步回呼可以直接用；
// 容量大約 5 MB，而這裡放的是幾十 KB 的 JSON。
const writableFS = (() => {
  const PREFIX = "fd2fs:";
  const cache = new Map();   // 路徑 → Uint8Array

  const key = (path) => PREFIX + path.replace(/^\/+/, "");
  const encode = (bytes) => {
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  };
  const decode = (text) => {
    const s = atob(text);
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  };

  return {
    get(path) {
      if (cache.has(path)) return cache.get(path);
      let stored = null;
      try {
        stored = localStorage.getItem(key(path));
      } catch (e) {
        return null;   // 隱私模式之類；當成沒有這個檔案
      }
      if (stored === null) return null;
      const bytes = decode(stored);
      cache.set(path, bytes);
      return bytes;
    },
    put(path, bytes) {
      cache.set(path, bytes);
      try {
        localStorage.setItem(key(path), encode(bytes));
        return true;
      } catch (e) {
        return false;  // 配額滿了；讓呼叫端把它當成寫入失敗
      }
    },
    remove(path) {
      cache.delete(path);
      try {
        localStorage.removeItem(key(path));
      } catch (e) { /* 同上，刪不掉就算了 */ }
    },
    rename(from, to) {
      const bytes = this.get(from);
      if (bytes === null) return false;
      if (!this.put(to, bytes)) return false;
      this.remove(from);
      return true;
    },
  };
})();

(() => {
  const fs = globalThis.fs;
  const enosys = () => {
    const err = new Error("not implemented");
    err.code = "ENOSYS";
    return err;
  };
  const enoent = (path) => {
    const err = new Error("no such file or directory: " + path);
    err.code = "ENOENT";
    return err;
  };
  const files = new Map();   // fd → {path, bytes, pos, writable}
  let nextFd = 100;          // 0/1/2 留給 stdin/stdout/stderr
  const originalWrite = fs.write.bind(fs);   // stdout/stderr 仍走它

  // 包裡沒有的檔案才走這條。同步是被 Go 的 fs 介面逼的，不是選擇。
  const fetchSync = (path) => {
    const request = new XMLHttpRequest();
    request.open("GET", path, false);
    request.overrideMimeType("text/plain; charset=x-user-defined");
    try {
      request.send(null);
    } catch (e) {
      return null;
    }
    if (request.status !== 200 && request.status !== 0) return null;
    const text = request.responseText;
    const out = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) out[i] = text.charCodeAt(i) & 0xff;
    return out;
  };

  // 讀取的優先序：寫過的檔案 → 資產包 → 逐檔取用。寫過的要排最前面，否則存檔
  // 之後讀回來的還是包裡那份。
  const read = (path) => writableFS.get(path) || assetPak.get(path) || fetchSync(path);

  // wasm_exec.js 的 constants 全是 -1（它自己註明 unused），所以旗標只能看 Go 傳
  // 進來的原始 openmode：syscall/fs_js.go 在 O_WRONLY／O_RDWR 時才會併進那些 -1，
  // 結果就是「低位有值」代表要寫。
  const wantsWrite = (flags) => (flags & 3) !== 0 || flags < 0;

  fs.open = (path, flags, mode, callback) => {
    const fd = nextFd++;
    if (wantsWrite(flags)) {
      const existing = writableFS.get(path);
      files.set(fd, {
        path,
        bytes: existing && (flags & 512) === 0 ? existing : new Uint8Array(0),
        pos: 0,
        writable: true,
      });
      return callback(null, fd);
    }
    const bytes = read(path);
    if (bytes === null) return callback(enoent(path));
    files.set(fd, { path, bytes, pos: 0 });
    callback(null, fd);
  };

  fs.write = (fd, buffer, offset, length, position, callback) => {
    const file = files.get(fd);
    if (!file || !file.writable) {
      // 1/2 是 stdout/stderr，交還給原本的 polyfill。
      if (fd === 1 || fd === 2) return originalWrite(fd, buffer, offset, length, position, callback);
      return callback(enosys());
    }
    const start = position === null ? file.pos : position;
    const chunk = buffer.subarray(offset, offset + length);
    if (start + chunk.length > file.bytes.length) {
      const grown = new Uint8Array(start + chunk.length);
      grown.set(file.bytes);
      file.bytes = grown;
    }
    file.bytes.set(chunk, start);
    if (position === null) file.pos = start + chunk.length;
    callback(null, length);
  };

  // 寫入的檔案在 close 時才落地，與 Go 那邊「寫暫存檔再 rename」的流程對得上。
  fs.rename = (from, to, callback) => {
    callback(writableFS.rename(from, to) ? null : enoent(from));
  };
  fs.unlink = (path, callback) => {
    writableFS.remove(path);
    callback(null);
  };
  fs.mkdir = (path, perm, callback) => callback(null);   // 沒有目錄的概念
  fs.chmod = (path, mode, callback) => callback(null);
  fs.fchmod = (fd, mode, callback) => callback(null);
  fs.fsync = (fd, callback) => callback(null);

  fs.read = (fd, buffer, offset, length, position, callback) => {
    const file = files.get(fd);
    if (!file) return callback(enosys());
    const start = position === null ? file.pos : position;
    const end = Math.min(start + length, file.bytes.length);
    const n = Math.max(0, end - start);
    buffer.set(file.bytes.subarray(start, start + n), offset);
    if (position === null) file.pos = start + n;
    callback(null, n);
  };

  fs.close = (fd, callback) => {
    const file = files.get(fd);
    files.delete(fd);
    if (file && file.writable && !writableFS.put(file.path, file.bytes)) {
      const err = new Error("no space left on device: " + file.path);
      err.code = "ENOSPC";
      return callback(err);
    }
    callback(null);
  };

  const stats = (size) => ({
    dev: 0, ino: 0, mode: 33188, nlink: 1, uid: 0, gid: 0, rdev: 0,
    size, blksize: 4096, blocks: Math.ceil(size / 512),
    atimeMs: 0, mtimeMs: 0, ctimeMs: 0, birthtimeMs: 0,
    isDirectory: () => false,
  });

  fs.fstat = (fd, callback) => {
    const file = files.get(fd);
    if (!file) return callback(enosys());
    callback(null, stats(file.bytes.length));
  };

  fs.stat = (path, callback) => {
    const bytes = read(path);
    if (bytes === null) return callback(enoent(path));
    callback(null, stats(bytes.length));
  };
  fs.lstat = fs.stat;

  // 相對路徑要補工作目錄：syscall/fs_js.go 的 Open 在 path[0] != '/' 時呼叫
  // process.cwd()，而 wasm_exec.js 附的 process polyfill 對它也是 ENOSYS。
  globalThis.process.cwd = () => "/";
})();

const status = document.getElementById("status");
(async () => {
  try {
    status.textContent = "載入資產包…";
    const count = await assetPak.load("assets.pak");
    status.textContent = `資產包 ${count} 個檔案，啟動中…`;
    const go = new Go();
    const wasm = await WebAssembly.instantiateStreaming(fetch("fd2.wasm"), go.importObject);
    status.textContent = "";
    await go.run(wasm.instance);
  } catch (e) {
    status.textContent = "載入失敗：" + e;
    throw e;
  }
})();
</script></body></html>
