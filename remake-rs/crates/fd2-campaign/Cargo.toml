[package]
name = "fd2-campaign"
description = "FD2 remake campaign and content layer (port of the frozen Go campaign, ending, presentation and localization packages)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# 函式 doc 逐字保留 Go 註解，其中縮排行在 rustdoc 會被當成 Rust 程式碼；不跑 doctest。
doctest = false

[dependencies]
fd2-formats = { path = "../fd2-formats" }
fd2-rules = { path = "../fd2-rules" }
# 版本與 feature 照 fd2-rules：釘在工作區 Cargo.lock 既有版本，不新增套件版本；
# serde_json 開 float_roundtrip，讀小數與 Go strconv 一樣正確捨入。
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
# raw_value：Go json.RawMessage 的對應（campaign 編譯輸出保留原始 JSON 片段）。
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "raw_value"] }
# 分離素材的 indexed 與灰階 PNG（separated_shop_assets.go）；版本同 fd2-formats。
png = "=0.18.1"
sha2 = "=0.10.9"
