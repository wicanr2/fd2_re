[package]
name = "fd2-formats"
description = "FD2 original file formats: save ABI and resource decoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# 分離素材的 PNG 與 metadata 解碼（dato、afm）；版本釘在工作區 Cargo.lock 既有版本，不新增套件版本。
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
