[package]
name = "fd2-rules"
description = "FD2 remake deterministic battle rules (port of the frozen Go battle package)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# 函式 doc 逐字保留 Go 註解，其中縮排行在 rustdoc 會被當成 Rust 程式碼；不跑 doctest。
doctest = false

[dependencies]
fd2-formats = { path = "../fd2-formats" }
# JSON 載入與 Go []byte 的 base64 欄位（PORTING.md「開工前的決定」第 2 點）；版本釘在工作區
# Cargo.lock 既有版本，不新增套件版本。
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# `model.go` 以 SHA-256 核對 native_turn_event_controls.json；黃金差分也用它核對輸入檔。
sha2 = "=0.10.9"
