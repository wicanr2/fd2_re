[package]
name = "fd2-app"
description = "FD2 remake Bevy shell: window, rendering, input, audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bevy = "0.20.1"
serde_json = "1"
# R5 階段 4（r5w）：遊戲狀態與 CPU 畫格；sha2 用 Cargo.lock 已鎖定的版本（與 fd2-game 同一版）記畫格雜湊。
fd2-game = { path = "../fd2-game" }
# 音訊（R5 階段 4 r5o）：只多出 fd2-app 對 Cargo.lock 已鎖定套件的依賴邊；feature 照 bevy_audio 已啟用的
# （rodio 的 playback、tracing、lewton；lewton 預設的 ogg）。lewton 解 OGG，rodio 的 SampleRateConverter 重取樣，
# sha2 給 r5o_audio_pcm 的 PCM 雜湊。
lewton = "=0.10.2"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "tracing", "lewton"] }
sha2 = "=0.10.9"
