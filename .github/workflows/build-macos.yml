name: Build macOS Universal
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: remake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache-dependency-path: remake/go.sum
      - name: 建置雙架構並組裝正式 bundle
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/fd2-macos-build.log") 2>&1
          version=$(cat ../VERSION)
          echo "FD2_VERSION=$version" >> "$GITHUB_ENV"
          work="../work/release-$version/macos"
          mkdir -p "$work/FD2-$version-macos-universal/FD2.app/Contents/MacOS"
          app="$work/FD2-$version-macos-universal/FD2.app"
          go mod download all
          python3 packaging/release.py stage "$app/Contents/Resources" --platform macos-universal
          CGO_ENABLED=1 GOARCH=arm64 CGO_CFLAGS="-arch arm64" CGO_LDFLAGS="-arch arm64" go build -trimpath -buildvcs=false -ldflags="-s -w -X main.buildVersion=$version" -o "$work/fd2-arm64" ./cmd/fd2
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" go build -trimpath -buildvcs=false -ldflags="-s -w -X main.buildVersion=$version" -o "$work/fd2-amd64" ./cmd/fd2
          lipo -create "$work/fd2-arm64" "$work/fd2-amd64" -output "$app/Contents/MacOS/fd2"
          lipo "$app/Contents/MacOS/fd2" -verify_arch arm64 x86_64
          python3 - "$app" "$version" <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          with (app / "Contents/Info.plist").open("wb") as out:
              plistlib.dump(dict(CFBundleExecutable="fd2", CFBundleIdentifier="tw.wicanr2.fd2re",
                  CFBundleName="炎龍騎士團2 重製", CFBundlePackageType="APPL",
                  CFBundleShortVersionString=version[2:].split("-")[0],
                  CFBundleVersion=version[2:].split("-")[0], FD2ReleaseVersion=version,
                  NSHighResolutionCapable=True, CFBundleIconFile="fd2.icns"), out)
          PY
          iconset="$work/fd2.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" packaging/fd2.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            retina=$((size * 2))
            sips -z "$retina" "$retina" packaging/fd2.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/fd2.icns"
          chmod +x "$app/Contents/MacOS/fd2"
          cp "$app/Contents/Resources/README.txt" "$work/FD2-$version-macos-universal/README.txt"
      - name: 公開本輪建置失敗摘要
        if: failure()
        run: |
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fd2-macos-build.log"
          message = log.read_text(encoding="utf-8", errors="replace")[-28000:] if log.exists() else "建置log尚未建立"
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=FD2 macOS建置直接紀錄::" + message)
          PY
      - name: 空白目錄執行原生 bundle 自檢及 ZIP
        run: |
          set -euo pipefail
          version="$FD2_VERSION"
          work="../work/release-$version/macos"
          package="$work/FD2-$version-macos-universal"
          app="$package/FD2.app"
          smoke="../dist-all/$version/smoke"
          out="../dist-all/$version/patch"
          mkdir -p "$smoke" "$out"
          python3 - "$app" "$smoke/macos-self-check.log" <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          exe = (pathlib.Path(sys.argv[1]) / "Contents/MacOS/fd2").resolve()
          with tempfile.TemporaryDirectory() as empty:
              env = dict(os.environ, FD2_PACKAGE_SELF_CHECK="1", XDG_DATA_HOME=empty + "/xdg")
              result = subprocess.run([str(exe)], cwd=empty, env=env, capture_output=True, text=True, timeout=90)
              pathlib.Path(sys.argv[2]).write_text(result.stdout + result.stderr, encoding="utf-8")
              print(result.stdout, result.stderr)
              result.check_returncode()
          PY
          python3 packaging/release.py zip "$package" --output "$out/FD2-$version-macos-universal.zip"
          python3 packaging/release.py attest "$app/Contents/Resources" --platform macos-universal --output "$out/FD2-$version-macos-universal.zip" --log "$smoke/macos-self-check.log"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist-all/*/patch/*
          if-no-files-found: error
