name: Build Linux x86_64 AppImage
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 建立鎖版工具映像
        run: docker build -f remake/packaging/Dockerfile.appimage -t fd2-build-appimage:latest .
      - name: 隔離建置及實際 AppImage 自檢
        run: timeout 1200s bash remake/packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist-all/*/patch/*
          if-no-files-found: error
