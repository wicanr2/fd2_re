# build-linux.yml — 在真正的 Linux runner 重建並執行 AppImage 封包自我檢查。
name: Build Linux x86_64 AppImage

on:
  workflow_dispatch:
  push:
    tags: ['v*-linux']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 建立鎖定的 AppImage 工具映像
        run: |
          docker build \
            -f remake/packaging/Dockerfile.appimage \
            -t fd2-build-appimage:latest .

      - name: 以一次性無網路容器建置 AppImage
        run: remake/packaging/build-appimage.sh

      - name: 從空白工作目錄執行具型別封包檢查
        run: |
          appimage="$GITHUB_WORKSPACE/remake/packaging/dist/FD2-x86_64.AppImage"
          empty="$(mktemp -d)"
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >"$empty/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true; rm -rf "$empty"' EXIT
          for attempt in {1..50}; do
            if [ -S /tmp/.X11-unix/X99 ]; then break; fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              cat "$empty/xvfb.log"
              exit 1
            fi
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99
          cd "$empty"
          DISPLAY=:99 FD2_PACKAGE_SELF_CHECK=1 \
            timeout 60s "$appimage" --appimage-extract-and-run

      - name: 驗證雜湊
        working-directory: remake/packaging/dist
        run: |
          sha256sum -c FD2-x86_64.AppImage.sha256
          empty="$(mktemp -d)"
          trap 'rm -rf "$empty"' EXIT
          cd "$empty"
          "$GITHUB_WORKSPACE/remake/packaging/dist/FD2-x86_64.AppImage" \
            --appimage-extract >/dev/null
          test -f squashfs-root/LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: fd2-linux-x86_64-appimage
          path: |
            remake/packaging/dist/FD2-x86_64.AppImage
            remake/packaging/dist/FD2-x86_64.AppImage.sha256
          if-no-files-found: error
