name: Build Windows x86_64
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: remake
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache-dependency-path: remake/go.sum
      - name: 準備 MinGW 及正式清單
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          $env:CGO_ENABLED = "1"
          go mod download all
          $version = (Get-Content ../VERSION -Raw).Trim()
          "FD2_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $stage = "../work/release-$version/windows/FD2-$version-windows-x86_64"
          python packaging/release.py stage $stage --platform windows-x86_64
      - name: 建置正式 GUI 程式
        run: |
          $version = $env:FD2_VERSION
          $stage = "../work/release-$version/windows/FD2-$version-windows-x86_64"
          $env:CGO_ENABLED = "1"
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui -X main.buildVersion=$env:FD2_VERSION" -o "$stage/fd2.exe" ./cmd/fd2
          if ($LASTEXITCODE -ne 0) { throw "Windows 建置失敗" }
          python packaging/release.py verify $stage --platform windows-x86_64
      - name: 空白工作目錄執行原生自檢及打包
        run: |
          $version = $env:FD2_VERSION
          $stage = (Resolve-Path "../work/release-$version/windows/FD2-$version-windows-x86_64").Path
          $out = "../dist-all/$version/patch"
          $smoke = "../dist-all/$version/smoke"
          New-Item -ItemType Directory -Force $out, $smoke | Out-Null
          $smoke = (Resolve-Path $smoke).Path
          $empty = Join-Path $env:RUNNER_TEMP "fd2-empty"
          New-Item -ItemType Directory -Force $empty | Out-Null
          $env:FD2_PACKAGE_SELF_CHECK = "1"
          $env:XDG_DATA_HOME = Join-Path $empty "xdg"
          $process = Start-Process -FilePath "$stage/fd2.exe" -WorkingDirectory $empty -PassThru -RedirectStandardOutput "$smoke/windows-self-check.log" -RedirectStandardError "$smoke/windows-stderr.log"
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "Windows 自檢逾時" }
          $process.Refresh()
          Get-Content "$smoke/windows-self-check.log", "$smoke/windows-stderr.log"
          if ($process.ExitCode -ne 0) { throw "Windows 自檢失敗：$($process.ExitCode)" }
          python packaging/release.py zip $stage --output "$out/FD2-$version-windows-x86_64.zip"
          python packaging/release.py attest $stage --platform windows-x86_64 --output "$out/FD2-$version-windows-x86_64.zip" --log "$smoke/windows-self-check.log"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist-all/*/patch/*
          if-no-files-found: error
