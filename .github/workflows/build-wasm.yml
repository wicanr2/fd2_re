# build-wasm.yml — 產出網頁版的可重現 WASM 產物。
#
# 產物包含資產打包檔，但**不含原版衍生素材**——那要靠 FD2_ASSET_PACK 提供，公開
# 庫裡沒有。所以 CI 產出的東西會停在「缺原版素材」畫面，那是正確行為，不是失敗。
name: Build WebAssembly

on:
  workflow_dispatch:
  push:
    tags: ['v.*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 建立鎖定的 Go 工具映像
        run: |
          docker build \
            -f tools/docker/fd2-go-test.Dockerfile \
            -t fd2-go-test-local:latest .

      - name: 以一次性無網路容器建置 WASM
        run: tools/build_wasm.sh "$GITHUB_WORKSPACE/remake/web/dist"

      - name: 檢查產物存在且非空
        run: |
          cd "$GITHUB_WORKSPACE/remake/web/dist"
          for name in fd2.wasm wasm_exec.js index.html assets-manifest.json assets.pak; do
            test -s "$name" || { echo "缺少產物：$name"; exit 1; }
          done
          # wasm_exec.js 要是 Go 附的那一份，不是任何被改過的複本。
          grep -q "globalThis.Go" wasm_exec.js
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: fd2-wasm
          path: remake/web/dist/
          if-no-files-found: error
